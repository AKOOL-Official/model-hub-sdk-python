[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "akool-modelhub-sdk"
version = "0.1.0"
description = "AKOOL Model Hub sdk-python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx[socks]>=0.27,<1", "pydantic>=2.8,<3", "rfc8785>=0.1.4,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/akool_modelhub_sdk"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.16,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
